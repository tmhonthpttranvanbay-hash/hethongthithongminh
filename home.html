<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>
        // Sửa lỗi: Kiểm tra đúng tên biến 'currentUserName' thay vì 'currentUser'
        // Và nếu chưa đăng nhập thì đá về 'index.html'
        if (!localStorage.getItem('schoolName') || !localStorage.getItem('currentUserName')) {
            window.location.href = "index.html";
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG THI THÔNG MINH - HỌC SINH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-black tracking-wide">📚 CỔNG HỌC SINH</h1>
        <div class="flex items-center gap-4">
            <span id="user-display" class="font-bold text-sm bg-white/20 px-3 py-1 rounded-full">Đang tải...</span>
            <button onclick="localStorage.clear(); window.location.href='index.html'" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg text-xs font-bold transition-all">Đăng xuất</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div id="exam-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        // Cấu hình Firebase (Giữ nguyên của bạn)
        const firebaseConfig = { 
            apiKey: "AIzaSyDZagxoVsRN80fHYRu3N3NSO57tfpmds-4", 
            databaseURL: "https://chamcode-b55f7-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const schoolName = localStorage.getItem('schoolName');
        const myName = localStorage.getItem('currentUserName');
        const myClass = localStorage.getItem('currentClass');

        document.getElementById('user-display').innerText = `${myName} - Lớp ${myClass}`;

        // Load danh sách đề thi
        firebase.database().ref(`schools/${schoolName}/exams`).on('value', snapshot => {
            const container = document.getElementById('exam-list');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if(!data) {
                container.innerHTML = '<p class="col-span-full text-center p-10 font-bold text-slate-400">Hiện chưa có đề thi nào.</p>';
                return;
            }

            Object.keys(data).forEach(id => {
                const exam = data[id];
                // Kiểm tra xem đề thi có dành cho lớp của học sinh này không
                if (exam.assignedClasses && exam.assignedClasses.includes(myClass)) {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-2xl shadow-sm border hover:shadow-md transition-all";
                    card.innerHTML = `
                        <h3 class="text-xl font-bold text-indigo-900 mb-2">${exam.name}</h3>
                        <p class="text-sm text-slate-500 mb-4">Trạng thái: <span class="text-emerald-600 font-bold">Đang mở</span></p>
                        <button onclick="vaoThi('${id}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all">VÀO THI NGAY</button>
                    `;
                    container.appendChild(card);
                }
            });
        });

        function vaoThi(examId) {
            localStorage.setItem('activeExamId', examId);
            window.location.href = 'student.html';
        }
    </script>
</body>
</html>
