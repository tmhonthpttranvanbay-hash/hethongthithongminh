<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HỆ THỐNG THI THÔNG MINH - ĐĂNG NHẬP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative overflow-hidden">
    <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-md z-10 border border-white/20">
        <h2 class="text-3xl font-black text-center mb-8 text-slate-800 uppercase tracking-tighter">Đăng Nhập Hệ Thống</h2>
        
        <div class="space-y-4">
            <input type="text" id="school-id" placeholder="Mã trường (VD: THPT_PHU_TAM)" class="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            <input type="text" id="username" placeholder="Tên đăng nhập / Số điện thoại" class="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            <input type="password" id="password" placeholder="Mật khẩu" class="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            
            <div class="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                <button onclick="setRole('student')" id="btn-student" class="flex-1 py-3 rounded-xl font-bold transition-all bg-white shadow-sm text-indigo-600">Học Sinh</button>
                <button onclick="setRole('teacher')" id="btn-teacher" class="flex-1 py-3 rounded-xl font-bold transition-all text-slate-500">Giáo Viên</button>
            </div>

            <button onclick="handleLogin()" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-widest mt-4">Đăng Nhập Ngay</button>
        </div>
    </div>

    <script>
        // Cấu hình Firebase (Giữ nguyên của bạn)
        const firebaseConfig = { 
            apiKey: "AIzaSyDZagxoVsRN80fHYRu3N3NSO57tfpmds-4", 
            authDomain: "chamcode-b55f7.firebaseapp.com", 
            databaseURL: "https://chamcode-b55f7-default-rtdb.firebaseio.com", 
            projectId: "chamcode-b55f7", 
            storageBucket: "chamcode-b55f7.firebasestorage.app"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roleMode = 'student';
        function setRole(r) {
            roleMode = r;
            const s = document.getElementById('btn-student');
            const t = document.getElementById('btn-teacher');
            if(r === 'student') {
                s.className = "flex-1 py-3 rounded-xl font-bold transition-all bg-white shadow-sm text-indigo-600";
                t.className = "flex-1 py-3 rounded-xl font-bold transition-all text-slate-500";
            } else {
                t.className = "flex-1 py-3 rounded-xl font-bold transition-all bg-white shadow-sm text-indigo-600";
                s.className = "flex-1 py-3 rounded-xl font-bold transition-all text-slate-500";
            }
        }

        async function handleLogin() {
            const s = document.getElementById('school-id').value.trim();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btn = document.getElementById('login-btn');

            if(!s || !u || !p) return alert("Vui lòng nhập đầy đủ thông tin!");

            btn.innerText = "ĐANG KIỂM TRA...";
            btn.disabled = true;

            try {
                if (roleMode === 'teacher') {
                    const snap = await db.ref(`schools/${s}/teachers/${u}`).once('value');
                    const data = snap.val();
                    if (snap.exists() && data.password === p) {
                        localStorage.setItem('userRole', 'teacher');
                        localStorage.setItem('schoolName', s);
                        localStorage.setItem('currentUserName', data.fullName);
                        window.location.href = 'teacher.html';
                    } else {
                        alert("❌ Sai thông tin Giáo viên!");
                    }
                } else {
                    const snap = await db.ref(`schools/${s}/students/${u}`).once('value');
                    const data = snap.val();
                    if (snap.exists() && data.password === p) {
                        localStorage.setItem('userRole', 'student');
                        localStorage.setItem('schoolName', s);
                        localStorage.setItem('currentUserName', data.fullName);
                        localStorage.setItem('currentClass', data.className);
                        // CỐT LÕI: Chuyển hướng về trang danh sách đề thi (home.html)
                        window.location.href = 'home.html'; 
                    } else {
                        alert("❌ Sai thông tin Học sinh!");
                    }
                }
            } catch (e) {
                alert("Lỗi kết nối: " + e.message);
            } finally {
                btn.innerText = "ĐĂNG NHẬP NGAY";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
