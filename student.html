    function renderMathKeyboard(idx) {
        const symbols = ['±','×','÷','≠','≈','≤','≥','=','~','∞','α','β','γ','Δ','δ','θ','λ','μ','π','ρ','σ','φ','ω','Ω','∈','∉','⊂','⊃','∪','∩','∀','∃','∑','∏','∫','∬','∮','∂','∇','°','∠','⊥','△','□','○','→','←','↔','⇒','⇔','↑','↓'];
        const structures = [
            { label: 'Phân số', latex: '\\frac{a}{b}' }, { label: 'xⁿ', latex: 'x^{n}' }, { label: 'xₙ', latex: 'x_{n}' },
            { label: '√x', latex: '\\sqrt{x}' }, { label: 'ⁿ√x', latex: '\\sqrt[n]{x}' }, { label: '|x|', latex: '|x|' },
            { label: 'Giới hạn', latex: '\\lim_{x \\to \\infty}' }, { label: '∑', latex: '\\sum_{i=1}^{n}' }, { label: '∫', latex: '\\int_{a}^{b}' },
            { label: 'Hệ PT', latex: '\\begin{cases} x = 1 \\\\ y = 2 \\end{cases}' },
            { label: 'Ma trận', latex: '\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}' },
            { label: 'sin', latex: '\\sin(x)' }, { label: 'cos', latex: '\\cos(x)' }, { label: 'tan', latex: '\\tan(x)' },
            { label: 'log', latex: '\\log_{a}(x)' }, { label: 'ln', latex: '\\ln(x)' }, { label: 'véc-tơ', latex: '\\vec{v}' },
            { label: 'Dấu góc', latex: '\\angle A' }, { label: 'Độ (°)', latex: '^\\circ' }
        ];

        let symbolBtns = symbols.map(s => `<button type="button" onclick="insertMathText(${idx}, '${s}')" class="w-8 h-8 flex items-center justify-center bg-white border border-slate-200 rounded hover:bg-orange-100 hover:text-orange-600 hover:border-orange-300 transition-colors text-sm font-semibold shadow-sm">${s}</button>`).join('');
        let structBtns = structures.map(st => `<button type="button" onclick="insertMathFormula(${idx}, '${st.latex.replace(/\\/g, '\\\\')}')" class="px-3 h-10 flex items-center justify-center bg-white border border-slate-200 rounded hover:bg-blue-100 hover:text-blue-600 hover:border-blue-300 transition-colors text-sm font-semibold shadow-sm">${st.label}</button>`).join('');

        return `
            <div class="mt-4 border-t-2 border-orange-100 pt-4 bg-orange-50/30 p-4 rounded-xl">
                <p class="text-[11px] font-black text-orange-500 uppercase mb-2 flex items-center gap-1"><span>⚡</span> KÝ HIỆU NHANH:</p>
                <div class="flex flex-wrap gap-1.5 mb-4">${symbolBtns}</div>
                <p class="text-[11px] font-black text-blue-600 uppercase mb-2 mt-4 pt-4 border-t border-blue-100 flex items-center gap-1"><span>🧮</span> CẤU TRÚC TOÁN/LÝ/HÓA (CHUẨN LATEX):</p>
                <div class="flex flex-wrap gap-2">${structBtns}</div>
            </div>`;
    }

    window.insertMathText = function(idx, text) {
        let editor = window.essayEditors[idx]; if(!editor) return;
        let range = editor.getSelection(true);
        editor.insertText(range ? range.index : 0, text);
    };

    window.insertMathFormula = function(idx, latexStr) {
        let editor = window.essayEditors[idx]; if(!editor) return;
        let range = editor.getSelection(true);
        editor.insertEmbed(range ? range.index : 0, 'formula', latexStr);
    };

    function cleanPythonCode(code) {
        if (!code) return "";
        return code.replace(/input\s*\([^)]*\)/g, 'input()');

    // =====================================================================

    window.runStudentCode = function(idx) {
        try {
            const editor = window.codeEditors[idx];
            if (!editor) return alert("Lỗi: Không tìm thấy khung Code!");

            let code = editor.getValue();
            const inputData = document.getElementById(`stu-input-${idx}`).value;
            const expectedData = document.getElementById(`stu-expected-${idx}`).innerText.trim();
            const lang = document.getElementById(`stu-lang-${idx}`).value;
            
            const statusBox = document.getElementById(`stu-status-${idx}`);
            const outBox = document.getElementById(`stu-output-${idx}`);

            if (!code.trim()) return alert("Vui lòng viết code trước khi chạy!");
            statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-yellow-100 text-yellow-700'>⏳ Đang chạy...</span>";
            outBox.innerText = "⏳ Hệ thống đang biên dịch code..."; 

            if (lang === 'python') {
                if (typeof Sk === "undefined") { outBox.innerText = "❌ Lỗi: Thư viện Python chưa tải xong."; return; }
                code = cleanPythonCode(code);
                let inputLines = inputData ? inputData.replace(/\r/g, '').split('\n') : []; 
                let inputIdx = 0; let actualOut = "";
                
                Sk.configure({
                    output: function(text) { actualOut += text; },
                    read: function(x) { if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found"; return Sk.builtinFiles["files"][x]; },
                    inputfun: function() { return new Promise(resolve => resolve(inputIdx < inputLines.length ? inputLines[inputIdx++] : "")); }
                });
                
                Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
                .then(() => { 
                    outBox.innerText = actualOut || "(Code chạy thành công nhưng không in ra gì)"; 
                    checkStudentOutput(actualOut, expectedData, statusBox); 
                })
                .catch(err => { 
                    statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-red-100 text-red-700'>❌ Lỗi Code</span>";
                    outBox.innerText = actualOut + "\n❌ Lỗi Cú pháp Python:\n" + err.toString(); 
                });
                
            } else if (lang === 'cpp') {
                if (typeof JSCPP === "undefined") { outBox.innerText = "❌ Lỗi: Thư viện C++ chưa sẵn sàng."; return; }
                let actualOut = ""; let config = { stdio: { write: function(s) { actualOut += s; } } };
                try {
                    JSCPP.run(code, inputData, config);
                    outBox.innerText = actualOut || "(Code chạy thành công nhưng không in ra gì)"; 
                    checkStudentOutput(actualOut, expectedData, statusBox);
                } catch(cppErr) { 
                    statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-red-100 text-red-700'>❌ Lỗi Code</span>";
                    outBox.innerText = "❌ Lỗi biên dịch C++:\n" + cppErr.message; 
                }
            }
        } catch (error) { alert("Lỗi Hệ thống Web: " + error.message); }
    };

    function checkStudentOutput(actual, expected, statusBox) {
        let act = actual.trim(); let exp = expected.trim();
        if(exp === "") { statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-amber-100 text-amber-700'>⚠️ Code chạy tốt (Không có test mẫu)</span>"; }
        else if(act === exp) { statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-700'>✅ KHỚP KẾT QUẢ TEST MẪU</span>"; }
        else { statusBox.innerHTML = "<span class='font-bold text-xs px-2 py-1 rounded bg-red-100 text-red-700'>❌ CHƯA KHỚP KẾT QUẢ TEST</span>"; }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function safeJSONParse(text, defaultReturn) {
        try {
            let cleanText = text.replace(/```json/g, "").replace(/```/g, "").trim();
            return JSON.parse(cleanText);
        } catch (e) { return defaultReturn; }
    }

    function autoGradeCode(code, inputData, expectedData, lang) {
        return new Promise((resolve) => {
            let result = { isPass: false, actualOut: "" };
            if (!code || !code.trim()) return resolve(result);
            expectedData = expectedData ? expectedData.trim() : "";
            
            if (lang === 'python') {
                if (typeof Sk === "undefined") return resolve(result);
                if (typeof cleanPythonCode === "function") code = cleanPythonCode(code); 
                let actualOut = ""; 
                let inputLines = inputData ? inputData.replace(/\r/g, '').trim().split('\n') : []; 
                let inputIdx = 0;
                
                Sk.configure({
                    output: function(text) { actualOut += text; },
                    read: function(x) { if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found"; return Sk.builtinFiles["files"][x]; },
                    inputfun: function() { return new Promise(r => r(inputIdx < inputLines.length ? inputLines[inputIdx++] : "")); }
                });
                Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
                .then(() => { 
                    result.actualOut = actualOut; 
                    result.isPass = (expectedData !== "" && actualOut.trim() === expectedData); 
                    resolve(result); 
                })
                .catch((err) => { resolve(result); });
            } else if (lang === 'cpp') {
                if (typeof JSCPP === "undefined") return resolve(result);
                let actualOut = ""; let config = { stdio: { write: function(s) { actualOut += s; } } };
                try {
                    JSCPP.run(code, inputData, config);
                    result.actualOut = actualOut;
                    result.isPass = (expectedData !== "" && actualOut.trim() === expectedData);
                    resolve(result);
                } catch (e) { resolve(result); }
            } else resolve(result);
        });
    }

    // Hàm gọi AI với tính năng tự động nhảy Key nếu lỗi 403
    async function fetchWithFallback(promptText) {
        for (let i = 0; i < GEMINI_API_KEYS.length; i++) {
            const currentKey = GEMINI_API_KEYS[i];
            
            // Bỏ qua nếu bạn chưa dán key
            if (!currentKey || currentKey.includes("DÁN_KEY")) continue;

            console.log(`Đang chấm bằng Key số ${i + 1}...`);
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    return JSON.parse(data.candidates[0].content.parts[0].text);
                } else {
                    console.warn(`Key số ${i + 1} bị từ chối/quá tải, tự động chuyển Key tiếp theo...`);
                }
            } catch (error) {
                console.error(`Lỗi kết nối khi dùng Key ${i + 1}:`, error);
            }
        }
        return null; 
    }

    // 1. Hàm gọi chấm Tự luận
    async function goiAIGoogle(deBai, baremStr, tongDiem, baiLam) {
        if (!baiLam || baiLam.trim() === "") return { score: 0, feedback: "Học sinh chưa làm bài." };
        
        const promptText = `Bạn là giáo viên chấm thi tự luận.
        - Đề bài: ${deBai}
        - Barem/Đáp án: ${baremStr}
        - Tổng điểm tối đa: ${tongDiem}
        - Bài làm của học sinh: ${baiLam}
        Hãy chấm điểm (làm tròn đến 0.25) và đưa ra nhận xét.
        YÊU CẦU BẮT BUỘC TRẢ VỀ ĐÚNG ĐỊNH DẠNG JSON NÀY, KHÔNG THÊM BẤT KỲ CHỮ NÀO KHÁC: {"score": <số_điểm>, "feedback": "<lời_nhận_xét>"}`;

        const resultObj = await fetchWithFallback(promptText);
        
        if (resultObj) {
            return { score: Number(resultObj.score) || 0, feedback: String(resultObj.feedback) || "" };
        } else {
            return { score: 0, feedback: "Lỗi Hệ Thống: Không có API Key nào hoạt động!" };
        }
    }

        const resultObj = await fetchWithFallback(promptText);
        
        if (resultObj) {
            return { score: Number(resultObj.score) || 0, feedback: String(resultObj.feedback) || "" };
        } else {
            return { score: 0, feedback: "Lỗi Hệ Thống: Không có API Key nào hoạt động!" };
        }
    }

    async function confirmSubmit() {
        if (!examId) return;
        if (!confirm("Xác nhận nộp bài? AI sẽ bắt đầu đọc và chấm điểm chi tiết!")) return;

        const btnSubmit = document.getElementById('btn-nop-bai');
        if(btnSubmit) { btnSubmit.innerText = "⏳ ĐANG CHẤM BÀI..."; btnSubmit.disabled = true; }
        
        document.getElementById('loading-overlay').classList.remove('hidden');
        document.getElementById('loading-overlay').classList.add('flex');
        const statusText = document.getElementById('loading-status');

        try {
            // --- CHẤM TRẮC NGHIỆM ---
            statusText.innerText = "⏳ Đang chấm Trắc nghiệm...";
            let correct = 0;
            questions.forEach((q, i) => { if ((answers[i] || "") === (q.correctAnswer || q.answer || "")) correct++; });
            const weights = examData.weights || { mcq: 10, essay: 0, code: 0 };
            let scoreMCQ = questions.length > 0 ? parseFloat(((correct / questions.length) * (weights.mcq || 10)).toFixed(2)) : 0;

            let tatCaNhanXetAI = ""; 

            // --- CHẤM TỰ LUẬN ---
            statusText.innerText = "🤖 AI đang phân tích Barem Tự Luận...";
            let eAnsStr = ""; let scoreEssay = 0; let aiEssayResults = {};
            const sourceEssays = examData.essays || examData.essayQuestions || (examData.questions ? examData.questions.filter(q => q.type === 'essay') : []);
            
            if (sourceEssays && sourceEssays.length > 0) {
                for (let idx = 0; idx < sourceEssays.length; idx++) {
                    let baiLam = "";
                    let htmlContent = "";

                    if (window.essayEditors && window.essayEditors[idx]) {
                        htmlContent = window.essayEditors[idx].root.innerHTML;
                        let tempDiv = document.createElement("div");
                        tempDiv.innerHTML = htmlContent;
                        
                        let formulas = tempDiv.querySelectorAll('.ql-formula');
                        formulas.forEach(f => {
                            let mathExpr = f.getAttribute('data-value');
                            let newText = document.createTextNode(` $$${mathExpr}$$ `);
                            f.parentNode.replaceChild(newText, f);
                        });
                        
                        tempDiv.style.display = 'none';
                        document.body.appendChild(tempDiv);
                        baiLam = tempDiv.textContent.trim();
                        document.body.removeChild(tempDiv);
                    }

                    eAnsStr += `--- CÂU TỰ LUẬN ${idx+1} ---\n${htmlContent}\n\n`;
                    let q = sourceEssays[idx];
                    let deBai = q.content || q.questionText || "Đề bài tự luận";
                    let mangBarem = q.rubrics || q.barems || q.baremList || q.yBarem || q.details || q.options || q.answers;
                    let tongDiem = 0; let baremStr = "Chấm theo nội dung";
                    
                    if (mangBarem && mangBarem.length > 0) {
                        tongDiem = mangBarem.reduce((s, r) => s + (parseFloat((r.score || r.diem || r.point || 0).toString().replace(',', '.')) || 0), 0);
                        baremStr = "Chấm sát Barem:\n" + mangBarem.map((r, i) => `- Ý ${i+1}: ${r.text || r.content || r.title || r.noidung || "Ý này"} (${r.score || r.diem || r.point}đ)`).join('\n');
                    } else {
                        tongDiem = parseFloat((q.score || 10).toString().replace(',', '.'));
                    }
                    
                    let aiRes = await goiAIGoogle(deBai, baremStr, tongDiem, baiLam);
                    aiEssayResults[`cau_${idx+1}`] = aiRes;
                    scoreEssay += (aiRes.score || 0);
                    tatCaNhanXetAI += `[TỰ LUẬN - CÂU ${idx+1}]\nĐiểm: ${aiRes.score}\nNhận xét:\n${aiRes.feedback}\n\n`;
                    
                    await sleep(3000); 
                }
            }

            // --- CHẤM LẬP TRÌNH ---
            statusText.innerText = "💻 Đang chạy Test & AI chấm Barem Code...";
            let cAnsStr = ""; let scoreCode = 0; let aiCodeResults = {};
            const sourceCodes = examData.codes || examData.codeQuestions || (examData.questions ? examData.questions.filter(q => q.type === 'code') : []);
            
            if (sourceCodes && sourceCodes.length > 0) {
                for (let idx = 0; idx < sourceCodes.length; idx++) {
                    let q = sourceCodes[idx];
                    let code = window.codeEditors && window.codeEditors[idx] ? window.codeEditors[idx].getValue().trim() : "";
                    cAnsStr += `--- CODE CÂU ${idx+1} ---\n${code}\n\n`;

                    let input = document.getElementById(`stu-input-${idx}`) ? document.getElementById(`stu-input-${idx}`).value : (q.testInput || ""); 
                    let expected = q.expectedOutput || q.expected || ""; 
                    let lang = document.getElementById(`stu-lang-${idx}`)?.value || "python";
                    
                    let deBai = q.content || q.desc || "Câu hỏi lập trình";
                    let mangBarem = q.rubrics || q.barems || q.baremList || q.yBarem || q.details || q.options || q.answers;
                    let tongDiem = 0; let baremStr = "Chấm Thuật toán";
                    
                    if (mangBarem && mangBarem.length > 0) {
                        tongDiem = mangBarem.reduce((s, r) => s + (parseFloat((r.score || r.diem || r.point || 0).toString().replace(',', '.')) || 0), 0);
                        baremStr = "Chấm sát Barem:\n" + mangBarem.map((r, i) => `- Ý ${i+1}: ${r.text || r.content || r.title || r.noidung || "Ý này"} (${r.score || r.diem || r.point}đ)`).join('\n');
                    } else {
                        tongDiem = parseFloat((q.score || 10).toString().replace(',', '.'));
                    }
                    
                    let testStatus = await autoGradeCode(code, input, expected, lang);
                    let aiRes = await goiAIGoogleCode(deBai, baremStr, tongDiem, code, testStatus, expected);
                    
                    aiCodeResults[`code_${idx+1}`] = aiRes;
                    scoreCode += (aiRes.score || 0);
                    tatCaNhanXetAI += `[LẬP TRÌNH - CÂU ${idx+1}]\nĐiểm: ${aiRes.score}\nNhận xét:\n${aiRes.feedback}\n\n`;
                    
                    await sleep(3000); 
                }
            }

            let totalScore = parseFloat((scoreMCQ + scoreEssay + scoreCode).toFixed(2));

            statusText.innerText = "💾 Đang xuất bảng điểm lên Máy chủ...";
            const resultData = {
                studentName: myName, className: myClass, examId: examId, examName: examData.name,
                scoreMCQ: scoreMCQ, scoreEssay: scoreEssay, scoreCode: scoreCode, 
                totalScore: totalScore, correct: correct, total: questions.length,
                studentAnswers: answers, studentEssay: eAnsStr, studentCode: cAnsStr, time: new Date().toLocaleString(),
                aiFeedback: { essay: aiEssayResults, code: aiCodeResults }
            };

            await db.ref(`schools/${school}/results/${examId}/${myName.replace(/\s/g, '_')}`).set(resultData);

            if(typeof timerInterval !== 'undefined') clearInterval(timerInterval); 
            localStorage.removeItem(`draft_${examId}_${myName}`);
            
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('res-name-display').innerText = myName;
            document.getElementById('res-mcq-score').innerText = scoreMCQ + "đ";
            document.getElementById('res-essay-score').innerText = scoreEssay + "đ";
            document.getElementById('res-code-score').innerText = scoreCode + "đ";
            document.getElementById('res-total-score').innerText = totalScore;
            
            document.getElementById('result-modal').classList.remove('hidden');

            if (tatCaNhanXetAI !== "") {
                setTimeout(() => { alert("🎉 TỔNG HỢP NHẬN XÉT CỦA AI:\n\n" + tatCaNhanXetAI); }, 500);
            }

        } catch (error) {
            alert("Lỗi nộp bài: " + error.message);
            document.getElementById('loading-overlay').classList.add('hidden');
            if(btnSubmit) { btnSubmit.innerText = "NỘP BÀI LẠI"; btnSubmit.disabled = false; }
        }
    }

    // =====================================================================
    // 7. CÁC HÀM UI CƠ BẢN VÀ LƯU NHÁP
    // =====================================================================
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => { el.classList.remove('bg-white', 'text-indigo-700'); el.classList.add('bg-indigo-900', 'text-indigo-200'); });
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('btn-' + tabId).classList.add('bg-white', 'text-indigo-700');
        document.getElementById('btn-' + tabId).classList.remove('bg-indigo-900', 'text-indigo-200');
        document.getElementById('mcq-nav-box').style.display = (tabId === 'tab-mcq') ? 'block' : 'none';
        if(tabId === 'tab-code') setTimeout(() => { for(let k in window.codeEditors) window.codeEditors[k].refresh(); }, 100);
    }

    function renderNav() {
        const nav = document.getElementById('question-navigation'); nav.innerHTML = "";
        questions.forEach((_, i) => {
            const isDone = answers[i] !== undefined && answers[i] !== "";
            nav.innerHTML += `<button id="nav-q-${i}" onclick="changeQuestion(${i})" class="w-full aspect-square flex items-center justify-center rounded-xl border-2 font-bold text-sm ${i === currentIdx ? 'bg-indigo-600 text-white' : (isDone ? 'bg-emerald-500 text-white' : 'bg-white text-slate-400')}">${i + 1}</button>`;
        });
    }
    
    function changeQuestion(idx) {
        if (idx < 0 || idx >= questions.length) return; currentIdx = idx; renderNav();
        const q = questions[idx]; const container = document.getElementById('question-content');
        let html = `<h2 class="text-2xl font-bold text-slate-800 mb-8">${q.questionText || q.content}</h2><div class="grid grid-cols-1 gap-4">`;
        let opts = q.options || q.choices || [];
        opts.forEach((opt, i) => {
            const isSelected = answers[idx] === ['A','B','C','D'][i];
            html += `<label class="flex items-center p-5 border-2 ${isSelected ? 'border-indigo-500 bg-indigo-50' : 'border-slate-100'} rounded-[1.5rem] cursor-pointer">
                        <input type="radio" name="ans-${idx}" value="${['A','B','C','D'][i]}" ${isSelected ? 'checked' : ''} onchange="answers[${idx}]='${['A','B','C','D'][i]}'; changeQuestion(${idx}); saveDraft();" class="mr-4 w-6 h-6">
                        <span class="text-lg font-semibold">${['A','B','C','D'][i]}. ${typeof opt === 'object' ? opt.text : opt}</span>
                    </label>`;
        });
        container.innerHTML = html + "</div>";
    }

    function saveDraft() {
        if (!examId) return; let eAns = []; let cAns = [];
        if (window.essayEditors) {
            Object.keys(window.essayEditors).forEach(idx => {
                eAns.push(window.essayEditors[idx].root.innerHTML);
            });
        }
        const sourceCodes = examData.codes || examData.codeQuestions || (examData.questions ? examData.questions.filter(q => q.type === 'code') : []);
        if(sourceCodes) sourceCodes.forEach((_, idx) => { cAns.push(window.codeEditors[idx] ? window.codeEditors[idx].getValue() : ""); });
        localStorage.setItem(`draft_${examId}_${myName}`, JSON.stringify({ ans: answers, essay: eAns, code: cAns }));
    }

    function restoreDraft() {
        const saved = localStorage.getItem(`draft_${examId}_${myName}`);
        if (saved) {
            try {
                const draft = JSON.parse(saved); answers = draft.ans || {};
                if (draft.essay) {
                    setTimeout(() => {
                        draft.essay.forEach((val, idx) => { 
                            if (window.essayEditors && window.essayEditors[idx]) window.essayEditors[idx].root.innerHTML = val;
                        });
                    }, 500); 
                }
                if (draft.code) draft.code.forEach((val, idx) => { if(window.codeEditors[idx]) window.codeEditors[idx].setValue(val); });
            } catch (e) {}
        }
    }

    function startTimer(min) {
        let t = min * 60; const el = document.getElementById('timer');
        timerInterval = setInterval(() => {
            let m = Math.floor(t / 60); let s = t % 60; el.innerText = `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
            if (--t < 0) { clearInterval(timerInterval); alert("Hết giờ! Hệ thống tự động nộp bài."); confirmSubmit(); }
        }, 1000);
    }

</script>
